<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker><marker id="open" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#222"/></marker></defs><rect width="1240" height="1120" fill="white"/><text x="620" y="31" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">UML диаграмма последовательности создания записи</text><rect x="11" y="65" width="208" height="52" fill="#F0F3F5" stroke="#333"/><line x1="115" y1="117" x2="115" y2="1040" stroke="#888" stroke-dasharray="6 5"/><text x="115" y="97" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal">Пациент</text><rect x="236" y="65" width="208" height="52" fill="#F0F3F5" stroke="#333"/><line x1="340" y1="117" x2="340" y2="1040" stroke="#888" stroke-dasharray="6 5"/><text x="340" y="97" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal">Интерфейс пациента</text><rect x="491" y="65" width="208" height="52" fill="#F0F3F5" stroke="#333"/><line x1="595" y1="117" x2="595" y2="1040" stroke="#888" stroke-dasharray="6 5"/><text x="595" y="97" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal">Модуль записи</text><rect x="746" y="65" width="208" height="52" fill="#F0F3F5" stroke="#333"/><line x1="850" y1="117" x2="850" y2="1040" stroke="#888" stroke-dasharray="6 5"/><text x="850" y="97" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal">База данных</text><rect x="1006" y="65" width="208" height="52" fill="#F0F3F5" stroke="#333"/><line x1="1110" y1="117" x2="1110" y2="1040" stroke="#888" stroke-dasharray="6 5"/><text x="1110" y="97" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal">Уведомления</text><line x1="115" y1="175" x2="340" y2="175" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="227.5" y="166" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">1  Выбрать слот и подтвердить</text><line x1="340" y1="245" x2="595" y2="245" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="467.5" y="236" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">2  createAppointment(...)</text><text x="595" y="277" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal">Проверка прав по НФТ 07</text><line x1="595" y1="335" x2="850" y2="335" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="722.5" y="326" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">3  BEGIN и проверить слот</text><line x1="850" y1="395" x2="595" y2="395" stroke="#222" stroke-width="1.5" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="722.5" y="386" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">4  Состояние слота</text><rect x="20" y="440" width="1200" height="570" fill="none" stroke="#333" stroke-width="1.4"/><path d="M20 440 H85 V472 H20" fill="#E2E8ED" stroke="#333"/><line x1="20" y1="785" x2="1220" y2="785" stroke="#555" stroke-dasharray="6 4"/><text x="50" y="462" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">alt</text><text x="40" y="498" text-anchor="start" font-family="Arial" font-size="17" font-weight="normal">[слот свободен]</text><line x1="595" y1="540" x2="850" y2="540" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="722.5" y="531" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">5а  INSERT, занять слот, COMMIT</text><line x1="850" y1="595" x2="595" y2="595" stroke="#222" stroke-width="1.5" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="722.5" y="586" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">6а  ID записи</text><line x1="595" y1="650" x2="1110" y2="650" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="852.5" y="641" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">7а  Поставить подтверждение в очередь</text><line x1="595" y1="705" x2="340" y2="705" stroke="#222" stroke-width="1.5" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="467.5" y="696" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">8а  ID записи</text><line x1="340" y1="755" x2="115" y2="755" stroke="#222" stroke-width="1.5" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="227.5" y="746" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">9а  «Вы записаны»</text><text x="40" y="818" text-anchor="start" font-family="Arial" font-size="17" font-weight="normal">[слот уже занят]</text><line x1="595" y1="865" x2="850" y2="865" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="722.5" y="856" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">5б  ROLLBACK</text><line x1="595" y1="925" x2="340" y2="925" stroke="#222" stroke-width="1.5" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="467.5" y="916" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">6б  Конфликт слота</text><line x1="340" y1="980" x2="115" y2="980" stroke="#222" stroke-width="1.5" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="227.5" y="971" text-anchor="middle" font-family="Arial" font-size="15" font-weight="normal">7б  «Слот уже занят»</text><text x="620" y="1078" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal">Уведомление ставится в очередь только после COMMIT. В конфликтной ветке новая запись не создаётся.</text></svg>